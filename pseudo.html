<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choix du pseudo</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #2b2b2b;
      padding: 30px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 10px #00ffc3;
    }
    img {
      border-radius: 50%;
      margin-bottom: 15px;
      width: 64px;
      height: 64px;
    }
    input, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      border-radius: 4px;
      border: 1px solid #00ffc3;
      background-color: #1e1e1e;
      color: white;
    }
    button {
      background-color: #00ffc3;
      color: #1e1e1e;
      cursor: pointer;
    }
    button:hover {
      background-color: #00cc9a;
    }
    .error {
      color: red;
      font-size: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="userAvatar" src="" alt="Avatar">
    <p id="userEmail">Chargement...</p>
    <input type="text" id="pseudoInput" placeholder="Choisis un pseudo unique">
    <button id="submitBtn">Valider</button>
    <div class="error" id="errorText"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(
      'https://vrdkbpyyavkcwpqshwyj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyZGticHl5YXZrY3dwcXNod3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNjU4ODUsImV4cCI6MjA2NzY0MTg4NX0.ktTFRPbZUWxpGxx8g0EyqTPqgVfOyU3MYd70euwiTxY'
    );

    const userEmail = document.getElementById('userEmail');
    const userAvatar = document.getElementById('userAvatar');
    const pseudoInput = document.getElementById('pseudoInput');
    const errorText = document.getElementById('errorText');
    const submitBtn = document.getElementById('submitBtn');

    let session = null;

    async function checkUser() {
      const { data, error } = await supabase.auth.getUser();
      if (error || !data?.user) {
        window.location.href = 'index.html';
        return;
      }

      session = data.user;
      userEmail.textContent = session.email;
      if (session.user_metadata?.avatar_url) {
        userAvatar.src = session.user_metadata.avatar_url;
      }

      // Vérifie si un pseudo est déjà enregistré
      const { data: existing } = await supabase
        .from('users')
        .select('pseudo')
        .eq('id', session.id)
        .single();

      if (existing?.pseudo) {
        window.location.href = 'home.html'; // pseudo déjà défini
      }
    }

    checkUser();

    submitBtn.addEventListener('click', async () => {
      const pseudo = pseudoInput.value.trim();
      errorText.textContent = "";

      if (pseudo.length < 3) {
        errorText.textContent = "Pseudo trop court.";
        return;
      }

      // Vérifie unicité
      const { data: taken, error: takenError } = await supabase
        .from('users')
        .select('id')
        .eq('pseudo', pseudo)
        .maybeSingle();

      if (taken) {
        errorText.textContent = "Ce pseudo est déjà pris.";
        return;
      }

      // Ajoute ou met à jour la ligne dans la table users
      const { error: insertError } = await supabase
        .from('users')
        .upsert({
          id: session.id,
          email: session.email,
          pseudo: pseudo,
          avatar: session.user_metadata?.avatar_url || null,
          admin: false // Définir admin à false par défaut
        });

      if (insertError) {
        errorText.textContent = "Erreur lors de l'enregistrement : " + insertError.message;
        return;
      }

      window.location.href = 'home.html';
    });
  </script>
</body>
</html>
