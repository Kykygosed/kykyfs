<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de Bord Admin | Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --blueprint: #142c42;
  --blueprint-deep: #0c1e30;
  --grid-line: rgba(148, 191, 224, 0.10);
  --paper: #f3ede0;
  --paper-dim: #e6ddc8;
  --paper-ink: #1c2b1f;
  --accent: #ff6a35;
  --accent-dim: #d6552a;
  --ink: #edf3f8;
  --muted: #93aec2;
  --muted-dim: #6c8aa1;
  --line: rgba(147, 174, 194, 0.22);
  --status-new: #ff6a35;
  --status-progress: #e0b23c;
  --status-done: #4caf7d;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-body: 'Inter', system-ui, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: var(--blueprint);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 42px 42px;
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.6;
  min-height: 100vh;
}

a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.gate {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.gate-box {
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 4px;
  padding: 40px;
  max-width: 380px;
  width: 100%;
}

.gate-box .eyebrow-mono {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent-dim);
  margin-bottom: 10px;
}

.gate-box h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  margin-bottom: 20px;
}

.gate-box input {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--paper-dim);
  border-radius: 3px;
  font-size: 0.95rem;
  margin-bottom: 14px;
  background: #fff;
  color: var(--paper-ink);
}

.gate-box button {
  width: 100%;
  padding: 14px;
  background: var(--paper-ink);
  color: var(--paper);
  border: none;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  cursor: pointer;
}

.gate-box button:hover {
  background: var(--accent-dim);
  color: var(--blueprint-deep);
}

.gate-error {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--accent);
  margin-top: 12px;
  display: none;
}

.dashboard {
  display: none;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 6%;
  border-bottom: 1px solid var(--line);
  background: rgba(12, 30, 48, 0.9);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  width: 24px;
  height: 24px;
}

.logo-tag {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--muted-dim);
  letter-spacing: 1px;
  border: 1px solid var(--line);
  padding: 2px 6px;
  border-radius: 3px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

.live-dot {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--muted);
}

.live-dot::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--status-done);
}

.btn-logout {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--muted);
  background: none;
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 3px;
  cursor: pointer;
}

.btn-logout:hover {
  color: var(--ink);
  border-color: var(--muted);
}

main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 40px 6% 90px;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 36px;
}

.stat-box {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 22px 24px;
}

.stat-box .stat-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: block;
}

.stat-box .stat-value {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
}

.toolbar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  align-items: center;
}

.toolbar select,
.toolbar input {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
}

.toolbar input {
  flex: 1;
  min-width: 200px;
}

.ticket-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.ticket {
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 4px;
  padding: 22px 26px;
  position: relative;
}

.ticket-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.ticket-meta {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: #6b6250;
  margin-bottom: 6px;
}

.ticket-name {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
}

.ticket-email {
  font-size: 0.88rem;
  color: #5a5142;
}

.ticket-badge {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 3px;
  color: #fff;
  white-space: nowrap;
}

.badge-nouveau {
  background: var(--status-new);
}

.badge-en-cours {
  background: var(--status-progress);
  color: #2a2205;
}

.badge-traite {
  background: var(--status-done);
}

.ticket-formule {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  border: 1px solid var(--paper-ink);
  padding: 4px 10px;
  border-radius: 3px;
  margin-bottom: 14px;
}

.ticket-message {
  font-size: 0.92rem;
  color: var(--paper-ink);
  border-top: 1px solid var(--paper-dim);
  padding-top: 14px;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

.ticket-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.ticket-controls label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: #5a5142;
}

.ticket-controls select {
  background: #fff;
  border: 1px solid var(--paper-dim);
  color: var(--paper-ink);
  padding: 8px 12px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
}

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.9rem;
}

@media (max-width: 640px) {
  main {
    padding: 30px 5% 60px;
  }
  header {
    padding: 16px 5%;
  }
}
</style>
</head>
<body>

<div class="gate" id="gate">
<div class="gate-box">
<span class="eyebrow-mono">Accès restreint</span>
<h2>Tableau de bord admin</h2>
<input type="password" id="gate-passcode" placeholder="Code d'accès">
<button onclick="checkPasscode()">Entrer</button>
<p class="gate-error" id="gate-error">Code incorrect. Réessayez.</p>
</div>
</div>

<div class="dashboard" id="dashboard">
<header>
<div class="logo">
<svg class="logo-mark" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
<rect x="1" y="1" width="24" height="24" fill="none" stroke="#ff6a35" stroke-width="1.5"/>
<line x1="1" y1="9" x2="25" y2="9" stroke="#ff6a35" stroke-width="1"/>
<line x1="9" y1="9" x2="9" y2="25" stroke="#ff6a35" stroke-width="1"/>
</svg>
Tickets
<span class="logo-tag">ADMIN</span>
</div>
<div class="header-actions">
<span class="live-dot">Connecté en direct</span>
<button class="btn-logout" onclick="logout()">Se déconnecter</button>
</div>
</header>

<main>
<div class="stats-row">
<div class="stat-box">
<span class="stat-label">Total tickets</span>
<span class="stat-value" id="stat-total">0</span>
</div>
<div class="stat-box">
<span class="stat-label">Nouveaux</span>
<span class="stat-value" id="stat-nouveau">0</span>
</div>
<div class="stat-box">
<span class="stat-label">En cours</span>
<span class="stat-value" id="stat-en-cours">0</span>
</div>
<div class="stat-box">
<span class="stat-label">Traités</span>
<span class="stat-value" id="stat-traite">0</span>
</div>
</div>

<div class="toolbar">
<select id="filter-status" onchange="renderTickets()">
<option value="">Tous les statuts</option>
<option value="nouveau">Nouveau</option>
<option value="en cours">En cours</option>
<option value="traité">Traité</option>
</select>
<select id="filter-formule" onchange="renderTickets()">
<option value="">Toutes les formules</option>
<option value="Site Web Basique">Site Web Basique</option>
<option value="Site Web + Réservation">Site Web + Réservation</option>
<option value="Site + Réservation + Hébergement">Site + Réservation + Hébergement</option>
<option value="Demande Spécifique / Sur-mesure">Demande spécifique / sur-mesure</option>
</select>
<input type="text" id="filter-search" placeholder="Rechercher un nom ou un email" oninput="renderTickets()">
</div>

<div class="ticket-list" id="ticket-list"></div>
<div class="empty-state" id="empty-state" style="display:none;">Aucun ticket ne correspond à ces critères.</div>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBPq6Wfxzq02MfK69BFxHm9_FUjDGTmAcw",
  authDomain: "kykychat-24c7f.firebaseapp.com",
  databaseURL: "https://kykychat-24c7f-default-rtdb.firebaseio.com/",
  projectId: "kykychat-24c7f",
  storageBucket: "kykychat-24c7f.firebasestorage.app",
  messagingSenderId: "342562811927",
  appId: "1:342562811927:web:0fed1e1f511c4fddcfec52"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_PASSCODE = "admin2026";
let allTickets = [];

function checkPasscode() {
  const value = document.getElementById('gate-passcode').value;
  if (value === ADMIN_PASSCODE) {
    sessionStorage.setItem('admin-authed', 'yes');
    showDashboard();
  } else {
    document.getElementById('gate-error').style.display = 'block';
  }
}

function logout() {
  sessionStorage.removeItem('admin-authed');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('gate-passcode').value = '';
}

function showDashboard() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  listenForTickets();
}

function badgeClass(status) {
  if (status === 'en cours') return 'badge-en-cours';
  if (status === 'traité') return 'badge-traite';
  return 'badge-nouveau';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function listenForTickets() {
  const ticketsRef = db.ref('business/tickets');
  ticketsRef.on('value', function (snapshot) {
    const data = snapshot.val() || {};
    allTickets = Object.keys(data).map(function (key) {
      return Object.assign({ id: key }, data[key]);
    });
    allTickets.sort(function (a, b) {
      return (b.timestamp || 0) - (a.timestamp || 0);
    });
    renderStats();
    renderTickets();
  });
}

function renderStats() {
  document.getElementById('stat-total').textContent = allTickets.length;
  document.getElementById('stat-nouveau').textContent = allTickets.filter(function (t) { return t.status === 'nouveau'; }).length;
  document.getElementById('stat-en-cours').textContent = allTickets.filter(function (t) { return t.status === 'en cours'; }).length;
  document.getElementById('stat-traite').textContent = allTickets.filter(function (t) { return t.status === 'traité'; }).length;
}

function renderTickets() {
  const statusFilter = document.getElementById('filter-status').value;
  const formuleFilter = document.getElementById('filter-formule').value;
  const searchFilter = document.getElementById('filter-search').value.toLowerCase().trim();

  const filtered = allTickets.filter(function (t) {
    if (statusFilter && t.status !== statusFilter) return false;
    if (formuleFilter && t.formule !== formuleFilter) return false;
    if (searchFilter) {
      const haystack = ((t.name || '') + ' ' + (t.email || '')).toLowerCase();
      if (haystack.indexOf(searchFilter) === -1) return false;
    }
    return true;
  });

  const list = document.getElementById('ticket-list');
  const emptyState = document.getElementById('empty-state');

  if (filtered.length === 0) {
    list.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  list.innerHTML = filtered.map(function (t) {
    return renderTicketCard(t);
  }).join('');
}

function renderTicketCard(t) {
  const status = t.status || 'nouveau';
  return '' +
    '<div class="ticket">' +
      '<div class="ticket-top">' +
        '<div>' +
          '<div class="ticket-meta">' + t.id + ' — ' + formatDate(t.createdAt) + '</div>' +
          '<div class="ticket-name">' + escapeHtml(t.name || 'Sans nom') + '</div>' +
          '<div class="ticket-email">' + escapeHtml(t.email || '') + '</div>' +
        '</div>' +
        '<span class="ticket-badge ' + badgeClass(status) + '">' + status + '</span>' +
      '</div>' +
      '<span class="ticket-formule">' + escapeHtml(t.formule || 'Non précisé') + '</span>' +
      '<div class="ticket-message">' + escapeHtml(t.message || '') + '</div>' +
      '<div class="ticket-controls">' +
        '<label>Statut</label>' +
        '<select onchange="updateStatus(\'' + t.id + '\', this.value)">' +
          '<option value="nouveau"' + (status === 'nouveau' ? ' selected' : '') + '>Nouveau</option>' +
          '<option value="en cours"' + (status === 'en cours' ? ' selected' : '') + '>En cours</option>' +
          '<option value="traité"' + (status === 'traité' ? ' selected' : '') + '>Traité</option>' +
        '</select>' +
      '</div>' +
    '</div>';
}

function updateStatus(ticketId, newStatus) {
  db.ref('business/tickets/' + ticketId).update({ status: newStatus });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

if (sessionStorage.getItem('admin-authed') === 'yes') {
  showDashboard();
}

document.getElementById('gate-passcode').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') checkPasscode();
});
</script>
</body>
</html>
